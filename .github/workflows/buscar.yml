name: Buscar eventos en Fabrik

on:
  schedule:
    - cron: "17 * * * *"   # cada hora
  workflow_dispatch:        # botón "Run workflow" para correrlo a mano
  push:
    paths: ["data/seguir.json", "data/eventos.json", "data/candidatos.json"]

permissions:
  contents: write

concurrency:
  group: buscar
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Revisar Cobraticket y avisar
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC || 'fabrik-sole-691a6efce6' }}
          SITIO_URL: ${{ vars.SITIO_URL }}
        run: node scripts/buscar-cobraticket.mjs
      - name: Guardar cambios
        run: |
          git config user.name "agenda-fabrik"
          git config user.email "agenda-fabrik@users.noreply.github.com"
          git add data/eventos.json data/revisados.json data/seguir.json data/candidatos.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualiza eventos de Fabrik"
            git pull --rebase
            git push
          fi
