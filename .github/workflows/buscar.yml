name: Buscar eventos en Fabrik

on:
  schedule:
    - cron: "17 * * * *"     # cada hora: Cobraticket
    - cron: "17 */3 * * *"   # cada 3 horas: además, búsqueda web con Tavily
  workflow_dispatch:        # botón "Run workflow" para correrlo a mano
  push:
    paths: ["data/seguir.json", "data/eventos.json", "data/candidatos.json"]

permissions:
  contents: write

concurrency:
  group: buscar
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar links escondidos en la web (cada 3 horas)
        if: ${{ github.event.schedule == '17 */3 * * *' || github.event_name == 'workflow_dispatch' }}
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: node scripts/buscar-web.mjs
      - name: Revisar Mientrada y verificar links de Passline
        run: node scripts/buscar-otras.mjs
      - name: Revisar Cobraticket y avisar
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC || 'fabrik-sole-691a6efce6' }}
          SITIO_URL: ${{ vars.SITIO_URL || 'https://agenda-fabrik.vercel.app' }}
        run: node scripts/buscar-cobraticket.mjs
      - name: Guardar cambios
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC || 'fabrik-sole-691a6efce6' }}
          SITIO_URL: ${{ vars.SITIO_URL || 'https://agenda-fabrik.vercel.app' }}
        run: bash scripts/guardar.sh
